name: Build, Test and Deploy GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY || 'userflow' }}
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'userflow-api' }}
  TF_IN_AUTOMATION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Backend/UserFlow.slnx

      - name: Test backend
        run: dotnet test Backend/UserFlow.slnx --configuration Release --no-restore

      - name: Build backend
        run: dotnet build Backend/UserFlow.slnx --configuration Release --no-restore

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Enable Terraform bootstrap APIs
        run: |
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            --project="${PROJECT_ID}"

      - name: Create remote state bucket if missing
        run: |
          gcloud storage buckets describe "gs://${PROJECT_ID}-terraform-state" >/dev/null 2>&1 || \
          gcloud storage buckets create "gs://${PROJECT_ID}-terraform-state" --location="${REGION}" --uniform-bucket-level-access

      - name: Terraform init and validate
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
        run: |
          terraform init -backend-config="bucket=${PROJECT_ID}-terraform-state" -backend-config="prefix=userflow"
          terraform fmt -check
          terraform validate

      - name: Bootstrap APIs and Artifact Registry
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_artifact_registry: ${{ secrets.ARTIFACT_REGISTRY || 'userflow' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
        run: |
          terraform apply -auto-approve \
            -target='google_project_service.apis' \
            -target='google_artifact_registry_repository.docker' \
            -target='google_service_account.cloud_build' \
            -target='google_project_iam_member.build_artifact_writer' \
            -target='google_project_iam_member.build_log_writer' \
            -target='google_project_iam_member.build_builder'

      - name: Docker build and push with Cloud Build
        run: |
          gcloud builds submit . --config=cloudbuild.yaml \
            --substitutions=_REGION="${REGION}",_REPOSITORY="${REPOSITORY}" \
            --service-account="projects/${PROJECT_ID}/serviceAccounts/userflow-cloud-build@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_artifact_registry: ${{ secrets.ARTIFACT_REGISTRY || 'userflow' }}
          TF_VAR_cloud_run_service: ${{ secrets.CLOUD_RUN_SERVICE || 'userflow-api' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_artifact_registry: ${{ secrets.ARTIFACT_REGISTRY || 'userflow' }}
          TF_VAR_cloud_run_service: ${{ secrets.CLOUD_RUN_SERVICE || 'userflow-api' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
        run: terraform apply -auto-approve tfplan

      - name: Deploy latest image to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/userflow-api:latest" \
            --region="${REGION}" --quiet

      - name: Show deployment URLs
        working-directory: terraform
        run: terraform output
