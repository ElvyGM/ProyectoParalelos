services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: userflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./UserFlow.Api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=userflow;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-CLAVE_DEMO_USERFLOW_2026_CAMBIAR_ANTES_DE_PRODUCCION_123456}
      Jwt__Issuer: UserFlow.Api
      Jwt__Audience: UserFlow.Mobile
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data:
